#p2.on #paper{opacity:1;transform:none;transition-delay:.25s}
#paper img{width:100%;height:100%;display:block}
#txt{position:absolute;left:9%;right:8%;top:14.2%;bottom:6%;border:0;outline:0;resize:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(5.6cqw - 1px),#e3cfae 5.6cqw) local;color:var(--ink);font:400 3.4cqw/5.6cqw 'Kalam',cursive;overflow:auto}
#next{bottom:4%;animation:none;white-space:normal;width:74cqw;text-align:center;font-size:3.2cqw;border-radius:4cqw;opacity:0;pointer-events:none;transition:opacity .8s}#next.show{opacity:1;pointer-events:auto}
.fl{position:absolute;width:4.2cqw;height:7cqw;transform:translate(-50%,-100%) rotate(var(--r,0deg)) scaleY(var(--s,1));transform-origin:50% 100%;background:radial-gradient(ellipse at 50% 72%,#fffbd0 0,#ffd23f 42%,#ff8a1f 76%,transparent 77%);border-radius:50% 50% 50% 50%/68% 68% 32% 32%;filter:drop-shadow(0 0 1.8cqw #ffb347);animation:fk .14s infinite alternate;transition:opacity .25s;cursor:pointer}

.fl.out{opacity:0;animation:none;pointer-events:none}
@keyframes fk{to{translate:.25cqw 0;scale:1 1.09}}
.sm{position:absolute;width:3cqw;height:3cqw;border-radius:50%;background:#fff9;filter:blur(.8cqw);transform:translate(-50%,-100%);animation:sm 1.6s forwards;pointer-events:none}

#cf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

<div class="fl" style="left:37.7%;top:61.2%"></div><div class="fl" style="left:48.5%;top:58.9%"></div><div class="fl" style="left:61.4%;top:61.6%"></div>
<button id="blow">🎤 blow!</button>
<div id="toast"><b>Happyy Birthdayyy Anjaliiiii</b> 👽</div>
<canvas id="cf"></canvas></section>
</main>
<script>
const $=s=>document.querySelector(s),pgs=[...document.querySelectorAll('.pg')],fl=[...document.querySelectorAll('.fl')],btn=$('#blow'),toast=$('#toast');
// ✍️ Edit this default letter, or just tap the paper and type your own:
$('#txt').value="Dear Anjali,\n\nHappy 26th birthday! 🎉\nFrom that little crown-wearing princess to today, you keep shining brighter every year.\n\nMay this year bring you laughter, cake, and every wish you make.\n\nWith love,\nYour Khasss";
let cur=0;
let tm;function go(n){pgs[cur].classList.remove('on');pgs[n].classList.add('on');cur=n;if(n==3)reset();clearTimeout(tm);$('#next').classList.remove('show');if(n==2)tm=setTimeout(()=>$('#next').classList.add('show'),6000)}
$('#p0').onclick=()=>go(1);$('#seal').onclick=()=>go(2);$('#next').onclick=()=>go(3);
let starting=false,stream,ctx,an,buf,raf,acc=0,base=.01,last=0,done=false,nomic=false,lean=0;
function reset(){stop();fl.forEach(f=>{f.classList.remove('out');f.style.removeProperty('--r');f.style.removeProperty('--s')});acc=0;done=false;toast.classList.remove('show');btn.textContent=nomic?'💨 tap to blow':'🎤 blow!'}
function snuff(i){const f=fl[i];if(f.classList.contains('out'))return;f.classList.add('out');const s=document.createElement('div');s.className='sm';s.style.left=f.style.left;s.style.top=f.style.top;f.parentNode.appendChild(s);setTimeout(()=>s.remove(),1700);if(fl.every(x=>x.classList.contains('out')))win()}
function win(){done=true;stop();btn.textContent='🔥 relight';toast.classList.add('show');confetti()}
function stop(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(ctx){ctx.close();ctx=null}}
fl.forEach((f,i)=>f.onclick=()=>snuff(i));
const blowAll=()=>fl.forEach((_,i)=>setTimeout(()=>snuff(i),i*350));
btn.onclick=async()=>{
  if(done){reset();return}
  if(stream||starting)return;
  if(nomic){blowAll();return}
  starting=true;
  try{
    ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    await ctx.resume();an=ctx.createAnalyser();an.fftSize=1024;
    ctx.createMediaStreamSource(stream).connect(an);buf=new Float32Array(an.fftSize);
    btn.textContent='💨 blow now…';last=performance.now();acc=0;loop();
  }catch(e){nomic=true;stream=null;if(ctx){ctx.close();ctx=null}btn.textContent='💨 tap to blow';blowAll()}
  starting=false;
};
function loop(){
  const now=performance.now(),dt=(now-last)/1000;last=now;
  an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];
  const r=Math.sqrt(s/buf.length),thr=Math.max(.07,base*4),blowing=r>thr;
  if(!blowing)base=base*.97+Math.min(r,.03)*.03;
  acc=blowing?acc+dt:Math.max(0,acc-dt*.8);
  lean+=((blowing?1:0)-lean)*.25;
  fl.forEach((f,i)=>{if(f.classList.contains('out'))return;f.style.setProperty('--r',(lean*(14+i*3)*(i%2?-1:1))+'deg');f.style.setProperty('--s',1-lean*.3);if(acc>.35+i*.4)snuff(i)});
  if(!done)raf=requestAnimationFrame(loop);
}
function confetti(){const c=$('#cf'),g=c.getContext('2d');c.width=c.offsetWidth;c.height=c.offsetHeight;
  const P=[...Array(150)].map(()=>({x:Math.random()*c.width,y:-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,w:6+Math.random()*8,h:4+Math.random()*6,a:Math.random()*6,va:(Math.random()-.5)*.3,c:['#9b6bd1','#f7e463','#f06fa8','#6aa7f0','#7fd9b0'][Math.random()*5|0]}));let t=0;
  (function f(){g.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()});if(++t<280)requestAnimationFrame(f);else g.clearRect(0,0,c.width,c.height)})()}
</script></body></html>
